<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light only">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Projects Architecture</title>
<meta name="description" content="How my projects are designed and built, end to end.">
<style>
  :root { --ink:#1a1a1a; --muted:#767676; --line:#e6e6e6; }
  * { box-sizing:border-box; }
  body { margin:0; background:#fff; color:var(--ink); font-size:19px; line-height:1.7;
    font-family:"Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, "Times New Roman", serif; }
  a { color:inherit; text-decoration:none; }
  .wrap { max-width:660px; margin:0 auto; padding:40px 24px 80px; }

  /* top bar: Home | search | Projects Architecture */
  .bar { display:grid; grid-template-columns:1fr minmax(0,240px) 1fr; align-items:center; gap:16px;
    padding-bottom:20px; border-bottom:1px solid var(--line); }
  .home { justify-self:start; font-size:17px; }
  .title { justify-self:end; font-size:20px; font-weight:700; text-align:right; }
  .home:hover { text-decoration:underline; }
  #q { width:100%; padding:6px 12px; font-family:inherit; font-style:italic; font-size:16px; line-height:1.5; color:var(--ink);
    background:#fff; border:1px solid var(--line); border-radius:999px; text-align:center; }
  #q:focus-visible, .home:focus-visible, .title:focus-visible, .post:focus-visible {
    outline:2px solid var(--ink); outline-offset:3px; }

  .lede { margin:48px 0 32px; color:var(--muted); font-style:italic; font-size:18px; }

  /* post list */
  #list { list-style:none; margin:0; padding:0; }
  .post { display:grid; grid-template-columns:8.5rem 1fr; gap:16px; padding:14px 0;
    border-bottom:1px solid var(--line); }
  .post:hover .name { text-decoration:underline; text-underline-offset:4px; }
  .date { color:var(--muted); font-size:16px; font-variant-numeric:oldstyle-nums; padding-top:2px; }
  .name { font-size:21px; line-height:1.4; }
  .read { display:block; color:var(--muted); font-size:15px; font-style:italic; }
  .none { color:var(--muted); font-style:italic; }

  @media (max-width:560px) {
    .bar { grid-template-columns:1fr 1fr; }
    .search { grid-column:1 / -1; grid-row:2; }
    .post { grid-template-columns:1fr; gap:0; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <a class="home" href="https://isthiscoder.github.io/Projects/">Home</a>
    <div class="search"><input id="q" type="search" placeholder="Search titles, tags, dates" aria-label="Search write-ups"></div>
    <a class="title" href="">Projects Architecture</a>
  </div>

  <p class="lede">End to end Architecture of Projects Explained. How i Build.</p>

  <ul id="list"></ul>
</div>
<script>
  // EDIT HERE: one entry per write-up. date: YYYY-MM-DD, read: minutes, url: link to the full Hashnode post,
  // tags: comma-separated words people can search by (optional).
  const entries = [
    { title: "Intelligence Image: system design", date: "2026-10-12", read: 14,
      url: "https://example.hashnode.dev/intelligence-image", tags: "AI, computer vision, system design" },
    { title: "Document Q&A Bot: architecture", date: "2026-11-03", read: 18,
      url: "https://example.hashnode.dev/document-qa-bot", tags: "AI, RAG, backend" },
    { title: "Travel Experience Agent: how it was built", date: "2026-12-20", read: 22,
      url: "https://example.hashnode.dev/travel-agent", tags: "AI, agents, automation" }
  ];

  const fmt = d => new Date(d + "T00:00:00").toLocaleDateString("en-GB",
    { day: "numeric", month: "long", year: "numeric" });
  const list = document.getElementById("list"), q = document.getElementById("q");
  const sorted = entries.slice().sort((a, b) => b.date.localeCompare(a.date));

  function render(filter) {
    list.textContent = "";
    const f = filter.trim().toLowerCase();
    const shown = sorted.filter(e => !f ||
      (e.title + " " + (e.tags || "") + " " + fmt(e.date) + " " + e.date).toLowerCase().includes(f));
    if (!shown.length) { const n = document.createElement("li"); n.className = "none"; n.textContent = "Nothing found."; list.appendChild(n); return; }
    shown.forEach(e => {
      const li = document.createElement("li");
      const a = document.createElement("a"); a.className = "post"; a.href = e.url; a.rel = "noopener";
      const d = document.createElement("time"); d.className = "date"; d.dateTime = e.date; d.textContent = fmt(e.date);
      const box = document.createElement("div");
      const n = document.createElement("span"); n.className = "name"; n.textContent = e.title; box.appendChild(n);
      const info = [e.read ? e.read + " min read" : "", e.tags || ""].filter(Boolean).join(" | ");
      if (info) { const r = document.createElement("span"); r.className = "read"; r.textContent = info; box.appendChild(r); }
      a.append(d, box); li.appendChild(a); list.appendChild(li);
    });
  }
  q.addEventListener("input", () => render(q.value));
  render("");
</script>
</body>
</html>
